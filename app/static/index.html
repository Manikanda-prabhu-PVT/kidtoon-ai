<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KidToon AI</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #14100e;
      color: #f5f5f5;
    }
    .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
    h1 { text-align: center; }
    h1 span { color: #ff5a1f; }
    .subtitle { text-align: center; color: #aaa; margin-bottom: 30px; }
    textarea {
      width: 100%; box-sizing: border-box; height: 110px; padding: 14px;
      border-radius: 12px; border: 1px solid #444; background: #1f1815;
      color: #fff; font-size: 16px; resize: vertical;
    }
    button {
      margin-top: 12px; padding: 12px 28px; border: none; border-radius: 24px;
      background: #ff5a1f; color: #fff; font-size: 16px; cursor: pointer;
    }
    button:disabled { background: #666; cursor: not-allowed; }
    #status { margin-top: 16px; color: #ffb199; }
    .card {
      background: #1f1815; border: 1px solid #333; border-radius: 12px;
      padding: 16px; margin-top: 14px;
    }
    .card h3 { margin-top: 0; color: #ff5a1f; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Kid<span>Toon</span> AI</h1>
    <p class="subtitle">Type a story idea and get a kids' cartoon story.</p>

    <textarea id="prompt" placeholder="A cute rabbit and baby elephant help a lost bird find its mother..."></textarea>
    <button id="generateBtn">Generate</button>
    <div id="status"></div>
    <div id="result"></div>
  </div>

  <script>
    const promptBox = document.getElementById("prompt");
    const button = document.getElementById("generateBtn");
    const statusBox = document.getElementById("status");
    const resultBox = document.getElementById("result");

    function addCard(title, text) {
      const card = document.createElement("div");
      card.className = "card";
      const heading = document.createElement("h3");
      heading.textContent = title;
      const body = document.createElement("p");
      body.textContent = text;
      card.appendChild(heading);
      card.appendChild(body);
      resultBox.appendChild(card);
    }

    async function generate() {
      resultBox.innerHTML = "";
      statusBox.textContent = "Generating...";
      button.disabled = true;

      try {
        const response = await fetch("/story/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: promptBox.value })
        });
        const data = await response.json();

        if (!response.ok) {
          statusBox.textContent = "Error: " + (data.detail || "Something went wrong");
          return;
        }

        statusBox.textContent = "";
        addCard(data.title, "Your idea: " + data.prompt);
        data.characters.forEach(function (c) {
          addCard(c.name + " the " + c.type, c.description);
        });
        data.scenes.forEach(function (s) {
          addCard("Scene " + s.scene_number, s.narration);
        });
      } catch (error) {
        statusBox.textContent = "Could not reach the server.";
      } finally {
        button.disabled = false;
      }
    }

    button.addEventListener("click", generate);
  </script>
</body>
</html>
